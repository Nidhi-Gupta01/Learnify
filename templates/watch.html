{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Video</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script>
      // Persist dark mode on this page before paint
      (function(){
        try{
          if(localStorage.getItem('dark-mode') === 'enabled'){
            document.documentElement.classList.add('dark');
            document.addEventListener('DOMContentLoaded', function(){
              document.body?.classList?.add('dark');
            });
          }
        }catch(e){}
      })();
    </script>
</head>
<body>
  {% include 'header.html' %}
  <!-- Video Section -->
  <section class="watch-video">
    <div class="video-details">
      <iframe id="video-player" class="video" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      <h3 class="title" id="video-title">Video Title</h3>

      <div class="buttons">
        <button id="mark-complete" class="inline-btn">Mark Complete ✔</button>
        <a id="next-video" href="#" class="inline-btn" style="display:none;">Next Video ➡</a>
      </div>

      <div id="final-test" style="display:none; margin-top:20px;">
        <a href="{% url 'test' %}" class="inline-btn">Take Final Test</a>
      </div>
    </div>
  </section>
  <!-- Page-specific script for watch page (cache-busted) -->
  <script src="{% static 'watch.js' %}?v=2"></script>
   {% include 'footer.html' %}
</body>
</html>
