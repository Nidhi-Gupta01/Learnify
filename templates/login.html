{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="{% static 'style.css' %}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body class="login-page">
  <header class="header">
    <section class="flex">
      <h3 class="logo">Learnify</h3>
    </section>
  </header>

  <section id="login-form" class="form-container">
    <form action="{% url 'login' %}" method="post">
      {% csrf_token %} <!-- CSRF TOKEN ADDED -->
      <h3>login</h3>
      <p>your email <span>*</span></p>
      <input type="email" name="email" class="box" placeholder="enter your email" maxlength="100" required>
      <p>your password <span>*</span></p>
      <input type="password" name="password" class="box" placeholder="enter your password" maxlength="100" required>
      <input type="submit" name="submit" value="login now" class="btn">
      <p class="al-login"><a href="{% url 'register' %}">register </a>create new accoont</p>
    </form>
  </section>

  <script src="{% static 'learnify.js' %}"></script>
  <script src="{% static 'watch.js' %}"></script>
</body>

</html>
