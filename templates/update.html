{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Profile</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
  {% include 'header.html' %}
    <section class="form-container">
        <form action="" method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <h3>update profile</h3>
            <p>your name</p>
            <input type="text" name="name" class="box" value="{{ request.user.first_name }} {{ request.user.last_name }}" maxlength="100">
            <p>your email</p>
            <input type="email" name="email" class="box" value="{{ request.user.email }}" maxlength="100">
            <p>old password</p>
            <input type="password" name="old_password" class="box" placeholder="enter your old password" maxlength="100">
            <p>new password</p>
            <input type="password" name="new_password" class="box" placeholder="enter your new password" maxlength="100">
            <p>confirm password</p>
            <input type="password" name="confirm_password" class="box" placeholder="confirm your new password" maxlength="100">
            <p>update image</p>
            <input type="file" name="image" accept="image/*" class="box">
            <input type="submit" name="submit" value="update profile" class="btn">
        </form>
    </section>
     {% include 'footer.html' %}
</body>
</html>
